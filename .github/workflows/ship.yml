name: ship

# PR39: build once, preview PRs, deploy main, and verify artifact/production identity.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Hourly release-train heartbeat: redeploy + verify only if live is not
    # already serving main's HEAD (see the `skip` step).
    - cron: "5 * * * *"
  workflow_dispatch: {}

# Runs on one ref queue behind each other; a deploy in flight is never cancelled.
concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: write

env:
  PROD_URL: https://forgotten-mistory.web.app
  FIREBASE_PROJECT_ID: forgotten-mistory

jobs:
  gates:
    name: build · static export
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      # The build stamps <meta name="build-commit"> with HEAD only when the
      # tracked tree is clean — a CI checkout always is, so the artifact built
      # here carries this run's commit and is what `deploy` ships (D-002).
      - run: npm run build:static
      - name: Stamp artifact identity
        run: |
          node - <<'NODE'
          const { writeFileSync } = require('node:fs');
          const identity = {
            commit: process.env.GITHUB_SHA,
            run_id: process.env.GITHUB_RUN_ID,
            run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            built_at: new Date().toISOString(),
          };
          writeFileSync('out/.artifact-identity.json', JSON.stringify(identity, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: out
          include-hidden-files: true
          retention-days: 3

  preview:
    name: Firebase preview channel (PR)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          name: out
          path: out
      # Ship the artifact the gates passed, not a second build: firebase.json's
      # predeploy rebuild is dropped for this workspace only (D-002).
      - name: Use the built export as-is
        run: |
          set -euo pipefail
          jq 'del(.hosting.predeploy)' firebase.json > firebase.ship.json
          mv firebase.ship.json firebase.json
          test -f out/index.html
          node - <<'NODE'
          const id = require('./out/.artifact-identity.json');
          if (id.commit !== process.env.GITHUB_SHA) {
            throw new Error(`artifact ${id.commit} does not match ${process.env.GITHUB_SHA}`);
          }
          NODE
      - id: preview_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: forgotten-mistory
          expires: 2d

  deploy:
    name: deploy live · parity · rollback
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          name: out
          path: out

      # The page is downloaded to a file and parsed from the file: piping curl
      # into a parser that exits early gives curl EPIPE (exit 23) and turned a
      # healthy deploy red once (run 33965475659). Never pipe curl here.
      - name: Skip if live already serves HEAD (hourly heartbeat idempotency)
        id: skip
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          live=""
          if curl -fsS --max-time 20 -o "$tmp" "$PROD_URL/"; then
            if raw="$(grep -m1 -o 'name="build-commit" content="[0-9a-f]*"' "$tmp")"; then
              live="${raw##*content=\"}"
              live="${live%\"}"
            fi
          fi
          if [ -n "$live" ] && [[ "$GITHUB_SHA" == "$live"* ]]; then
            echo "live already serves $live (HEAD $GITHUB_SHA) — nothing to deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "live serves '${live:-nothing}', HEAD is ${GITHUB_SHA:0:8} — deploying"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use the built export as-is
        if: steps.skip.outputs.skip != 'true'
        run: |
          set -euo pipefail
          jq 'del(.hosting.predeploy)' firebase.json > firebase.ship.json
          mv firebase.ship.json firebase.json
          test -f out/index.html
          node - <<'NODE'
          const id = require('./out/.artifact-identity.json');
          if (id.commit !== process.env.GITHUB_SHA) {
            throw new Error(`artifact ${id.commit} does not match ${process.env.GITHUB_SHA}`);
          }
          NODE
          grep -m1 -o 'name="build-commit" content="[0-9a-f]*"' out/index.html

      - name: Deploy to Firebase Hosting (live)
        if: steps.skip.outputs.skip != 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: forgotten-mistory
          channelId: live

      - name: Build-hash parity
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          live=""
          for _ in $(seq 1 12); do
            if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' -o "$tmp" "$PROD_URL/?v=$expected"; then
              live=""
              if raw="$(grep -m1 -o 'name="build-commit" content="[0-9a-f]*"' "$tmp")"; then
                live="${raw##*content=\"}"
                live="${live%\"}"
              fi
              if [ -n "$live" ] && [[ "$expected" == "$live"* ]]; then
                echo "parity OK: live page serves $live (HEAD $expected)"
                echo "- verified live: \`$live\`" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::parity FAILED (live='${live:-nothing}', head=${expected:0:8})"
          exit 1

      # A failed deploy/parity on a fresh main commit is undone by a revert
      # commit, whose own push re-enters this workflow and redeploys the previous
      # state. Two guards: a heartbeat that deployed nothing has nothing to
      # revert, and a revert that itself fails must not revert the revert (D-007).
      - name: Auto-rollback on failure
        if: failure() && steps.skip.outputs.skip != 'true' && github.event_name == 'push'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          cred_file="$RUNNER_TEMP/rollback-sa.json"
          tmp="$(mktemp)"
          trap 'rm -f "$cred_file" "$tmp"' EXIT
          if git log -1 --format=%s | grep -q '^Revert '; then
            echo "::error::HEAD is already a revert and still fails — stopping the rollback chain; fix forward"
            exit 1
          fi
          git config user.name  "ship-bot"
          git config user.email "ship-bot@users.noreply.github.com"
          # Restore only the generated workspace edit from the deploy step; do not discard user changes broadly.
          git checkout -- firebase.json
          git fetch origin main
          remote_head="$(git rev-parse origin/main)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "::error::origin/main is $remote_head, not failing commit $GITHUB_SHA; refusing stale rollback"
            exit 1
          fi
          git revert --no-edit HEAD
          git push origin HEAD:main

          # GITHUB_TOKEN pushes do not retrigger this workflow, so rebuild the reverted source here.
          npm ci
          npm run build:static
          jq 'del(.hosting.predeploy)' firebase.json > firebase.ship.json
          mv firebase.ship.json firebase.json
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$cred_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$cred_file"
          npx firebase-tools@13 deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive

          expected="$(git rev-parse HEAD)"
          live=""
          parity_ok=false
          for _ in $(seq 1 12); do
            if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' -o "$tmp" "$PROD_URL/?rollback=$expected"; then
              live=""
              if raw="$(grep -m1 -o 'name="build-commit" content="[0-9a-f]*"' "$tmp")"; then
                live="${raw##*content=\"}"
                live="${live%\"}"
              fi
              if [ -n "$live" ] && [[ "$expected" == "$live"* ]]; then
                parity_ok=true
                break
              fi
            fi
            sleep 10
          done
          [ "$parity_ok" = true ] || { echo "::error::rollback parity FAILED (live='${live:-nothing}', head=${expected:0:8})"; exit 1; }
          echo "- rolled back, rebuilt, redeployed, and parity-checked reverted ${GITHUB_SHA:0:8} in this run" >> "$GITHUB_STEP_SUMMARY"

  # Cloud Functions ship only when their source (or the firebase.json that wires
  # them) changed; UI/UX cycles are hosting-only deploys.
  functions:
    name: deploy Cloud Functions (only when functions/** changed)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did functions/** change in this push?
        id: changed
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [[ "$before" =~ ^0+$ ]] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            before="$(git rev-parse HEAD~1)"
          fi
          if git diff --name-only "$before" "$GITHUB_SHA" -- functions firebase.json | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "functions/** unchanged since $before — skipping"
          fi
      - if: steps.changed.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - if: steps.changed.outputs.changed == 'true'
        run: npm ci --prefix functions
      - name: Deploy functions
        if: steps.changed.outputs.changed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase-tools@13 deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive --force
          rm -f "$RUNNER_TEMP/sa.json"
