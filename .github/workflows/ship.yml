name: ship

# One job: check, build, test, then make sure the live site serves this commit.
# Releases normally start from the VPS (scripts/ship.sh), which deploys before this
# run gets here, so the deploy step is skipped when the live page already carries
# this commit's build-commit meta.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Runs queue behind each other; a deploy in flight is never cancelled.
concurrency:
  group: ship
  cancel-in-progress: false

permissions:
  contents: read

env:
  LIVE_URL: https://forgotten-mistory.web.app/

jobs:
  ship:
    name: check, build, test, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test

      # The page is downloaded to a file and read from the file: piping curl into a
      # parser that exits early makes curl fail with EPIPE.
      - name: Check what the live site serves
        id: live
        run: |
          set -euo pipefail
          commit="$(git rev-parse --short=8 HEAD)"
          page="$(mktemp)"
          served=""
          if curl -fsS --max-time 20 -o "$page" "$LIVE_URL"; then
            html="$(<"$page")"
            if [[ "$html" =~ name=\"build-commit\"\ content=\"([^\"]+)\" ]]; then
              served="${BASH_REMATCH[1]}"
            fi
          fi
          rm -f "$page"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [ "$served" = "$commit" ]; then
            echo "The live site already serves $commit; nothing to deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "The live site serves '${served:-nothing}', this commit is $commit; deploying."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Firebase Hosting
        if: steps.live.outputs.deploy == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: forgotten-mistory
          channelId: live

      - name: Verify the live site serves this commit
        if: steps.live.outputs.deploy == 'true'
        env:
          COMMIT: ${{ steps.live.outputs.commit }}
        run: |
          set -euo pipefail
          page="$(mktemp)"
          served=""
          for _ in $(seq 1 12); do
            served=""
            if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' -o "$page" "${LIVE_URL}?verify=$COMMIT"; then
              html="$(<"$page")"
              if [[ "$html" =~ name=\"build-commit\"\ content=\"([^\"]+)\" ]]; then
                served="${BASH_REMATCH[1]}"
              fi
            fi
            if [ "$served" = "$COMMIT" ]; then
              echo "Live site serves $COMMIT."
              exit 0
            fi
            sleep 10
          done
          echo "::error::The live site serves '${served:-nothing}' instead of $COMMIT."
          exit 1
