name: Security

# Trigger contract:
# - pull_request → gate PRs on dependency + static analysis findings
# - push:main → re-baseline after merge
# - schedule → weekly sweep to catch newly-disclosed CVEs against unchanged code
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    # Every Monday 07:00 UTC (after the weekly Dependabot run above).
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── npm-audit ──
  # Gating: fails the job (and therefore the required check) on any
  # high or critical severity advisory in the dependency tree.
  npm-audit:
    name: npm audit (high/critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit (gating — fails on high/critical)
        run: npm audit --audit-level=high

  # ── codeql ──
  # Static analysis (SAST) for the JS/TS surface of the app.
  codeql:
    name: CodeQL analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
