name: Security

# Trigger contract:
# - pull_request → gate PRs on dependency + static analysis findings
# - push:main → re-baseline after merge
# - schedule → weekly sweep to catch newly-disclosed CVEs against unchanged code
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    # Every Monday 07:00 UTC (after the weekly Dependabot run above).
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── npm-audit ──
  # Gating: fails the job (and therefore the required check) on any
  # high or critical severity advisory in the dependency tree.
  npm-audit:
    name: npm audit (high/critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The gate is deliberately unqualified: no --omit, no ignore list, no
      # allow-list. If it is red, a high/critical advisory is genuinely present
      # in the tree and the only honest resolutions are to upgrade or to accept
      # the risk explicitly in a commit that changes this file.
      - name: Audit (gating — fails on high/critical)
        run: npm audit --audit-level=high

      # Runs whether or not the gate passed, so a red job says WHICH package is
      # unresolved and whether a non-breaking fix exists, instead of forcing a
      # log dive on every run.
      - name: Advisory breakdown
        if: always()
        run: |
          set -uo pipefail
          npm audit --json > /tmp/audit.json || true
          if ! jq -e 'has("metadata")' /tmp/audit.json >/dev/null 2>&1; then
            echo "::warning::npm audit emitted no parseable JSON — breakdown skipped. The gating step above is authoritative."
            exit 0
          fi
          {
            echo '## npm audit — high/critical breakdown'
            echo ''
            echo '| Package | Severity | Fix available | Breaking fix |'
            echo '|---------|----------|---------------|--------------|'
            jq -r '
              .vulnerabilities
              | to_entries
              | map(select(.value.severity == "high" or .value.severity == "critical"))
              | sort_by(.value.severity)
              | .[]
              | "| \(.key) | \(.value.severity) | \(if (.value.fixAvailable | type) == "boolean" then (.value.fixAvailable | tostring) else "\(.value.fixAvailable.name)@\(.value.fixAvailable.version)" end) | \(if (.value.fixAvailable | type) == "object" then (.value.fixAvailable.isSemVerMajor | tostring) else "false" end) |"
            ' /tmp/audit.json
            echo ''
            jq -r '"Totals — critical: \(.metadata.vulnerabilities.critical), high: \(.metadata.vulnerabilities.high), moderate: \(.metadata.vulnerabilities.moderate), low: \(.metadata.vulnerabilities.low)"' /tmp/audit.json
          } >> "$GITHUB_STEP_SUMMARY"

  # ── bundle-secret-scan ──
  # 2026-08-09 incident: a live API key reached production inside
  # out/_next/static/chunks/*.js because next.config.js mapped it into a
  # NEXT_PUBLIC_* variable, which Next.js inlines verbatim into browser code.
  # Source-only scanning cannot see that by construction, so this job builds the
  # real static export and scans the EMITTED bytes. It duplicates the gate that
  # `build` runs in CI & Deploy on purpose: this workflow also runs weekly on a
  # cron, so a credential that is added to the operator's environment after a
  # deploy is still caught against unchanged code.
  bundle-secret-scan:
    name: Built-output secret scan
    # Fork PRs never receive repo secrets, so the fail-loud build cannot run there.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build:static
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Scan emitted bundle for credential material
        run: npm run validate:secrets

  # ── codeql ──
  # Static analysis (SAST) for the JS/TS surface of the app.
  codeql:
    name: CodeQL analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
