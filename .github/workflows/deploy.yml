name: CI & Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Static quality gates (SPEC §11): strict typecheck + monochrome/tone/perf/parity/secret audit ──
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Strict typecheck
        run: npx tsc --noEmit
      - name: Static audit (TONE/MONO/PERF/PARITY/SEC)
        run: node scripts/validate/overhaul_static_audit.mjs

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  # ── E2E (NFR-COMPAT). Playwright serves a real production build in CI (config
  #    webServer) — the old `next dev` webServer compiled the heavy WebGL pages
  #    on demand and the job ran 2h+ before timing out. ──
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      # Regular `next build` does not require the key, but pass it so the test
      # build mirrors production (MiniVic Gemini brain). Restricted by referrer.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  # ── Performance / quality budgets (TC-NFR-PERF): Lighthouse via lighthouserc.json.
  #    Performance is a WARN (a cinematic WebGL site can't hit 0.9); CLS + a11y/seo
  #    stay hard gates. ──
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lighthouse budgets (lighthouserc.json)
        run: |
          npx next start -p 3000 &
          SERVER_PID=$!
          for _ in $(seq 1 45); do curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1 && break; sleep 1; done
          npx --yes @lhci/cli@0.13.0 collect --config=lighthouserc.json
          npx --yes @lhci/cli@0.13.0 assert --config=lighthouserc.json
          STATUS=$?
          kill "$SERVER_PID" 2>/dev/null || true
          exit $STATUS

  # ── Accessibility (TC-NFR-A11Y): axe + SEO/schema ──
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: axe accessibility + SEO
        run: npm run validate:phase06

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, lint, test, lighthouse, axe]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:static
        env:
          # Inlined into the client bundle for the MiniVic Gemini brain.
          # Restrict this key by HTTP referrer in Google AI Studio (see SPEC §0.1 / QA-SEC-01).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: out
          retention-days: 7

  # ── Automated deploy to Firebase Hosting (live channel). Runs ONLY on push to
  #    main, after every gate is green. PRs get the full CI but never deploy. ──
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: static-site
          path: out
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: forgotten-mistory
          channelId: live
