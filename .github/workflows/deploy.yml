name: CI & Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs (save CI), but NEVER cancel a push-to-main run: that run
  # owns the Firebase deploy, and two merges landing close together share the same
  # group (ref is always refs/heads/main) — cancel-in-progress would abort a deploy
  # mid-flight. Only PR runs are safe to cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── Static quality gates (SPEC §11): strict typecheck + monochrome/tone/perf/parity/secret audit ──
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Strict typecheck
        run: npx tsc --noEmit
      - name: Static audit (TONE/MONO/PERF/PARITY/SEC)
        run: node scripts/validate/overhaul_static_audit.mjs

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  # ── E2E (NFR-COMPAT). Playwright serves a real production build in CI (config
  #    webServer) — the old `next dev` webServer compiled the heavy WebGL pages
  #    on demand and the job ran 2h+ before timing out. ──
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      # build:static (FIREBASE_STATIC_EXPORT=1 + production) hard-requires this key
      # (next.config.js fail-loud); the regular `next build` does not but mirrors
      # production with it. Restricted by HTTP referrer.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Build the static export ONCE here, before Playwright. Playwright 1.57 starts the
      # webServer (`npm run build && next start -p 8080`, a SERVER build) BEFORE running
      # globalSetup, so if globalSetup built `out/` it would `rm -rf .next` out from
      # under the live :8080 server (transient 500/ENOENT on ~30 specs). Prebuilding
      # `out/` here means globalSetup's ensureStaticBuild finds it fresh and no-ops, and
      # the only `.next` rebuild is the webServer's own — never during a live server.
      # (`npm run build` later removes only `.next`; this `out/` survives for the
      # loopback static-server specs.)
      - run: npm run build:static
      - run: npx playwright test

  # ── Performance / quality budgets (TC-NFR-PERF): Lighthouse via lighthouserc.json.
  #    lighthouserc.json gates ONLY two things: performance (WARN, a cinematic WebGL
  #    site can't hit 0.9) and cumulative-layout-shift (hard ERROR, ≤0.1). a11y + SEO
  #    are gated by the separate `axe` job (validate:phase06), not by Lighthouse. ──
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lighthouse budgets (lighthouserc.json)
        run: |
          npx next start -p 3000 &
          SERVER_PID=$!
          for _ in $(seq 1 45); do curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1 && break; sleep 1; done
          npx --yes @lhci/cli@0.13.0 collect --config=lighthouserc.json
          npx --yes @lhci/cli@0.13.0 assert --config=lighthouserc.json
          STATUS=$?
          kill "$SERVER_PID" 2>/dev/null || true
          exit $STATUS

  # ── Accessibility (TC-NFR-A11Y): axe + SEO/schema ──
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: axe accessibility + SEO
        run: npm run validate:phase06

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, lint, test, lighthouse, axe]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:static
        env:
          # Inlined into the client bundle for the MiniVic Gemini brain.
          # Restrict this key by HTTP referrer in Google AI Studio (see SPEC §0.1 / QA-SEC-01).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: out
          retention-days: 7

  # ── Automated deploy to Firebase Hosting (live channel). Runs ONLY on push to
  #    main, after every gate is green. PRs get the full CI but never deploy. ──
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: static-site
          path: out
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: forgotten-mistory
          channelId: live
