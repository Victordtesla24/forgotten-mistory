name: CI & Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs (save CI), but NEVER cancel a push-to-main run: that run
  # owns the Firebase deploy, and two merges landing close together share the same
  # group (ref is always refs/heads/main) — cancel-in-progress would abort a deploy
  # mid-flight. Only PR runs are safe to cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── Static quality gates (SPEC §11): strict typecheck + monochrome/tone/perf/parity/secret audit ──
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Strict typecheck
        run: npx tsc --noEmit
      - name: Static audit (TONE/MONO/PERF/PARITY/SEC)
        run: node scripts/validate/overhaul_static_audit.mjs

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  # ── E2E (NFR-COMPAT). The suite asserts GPU-only rendering — CSS backdrop-filter
  #    compositing AND heavy R3F/HUD frame rates — which CANNOT pass on GitHub's GPU-less
  #    runners (SwiftShader reports backdrop-filter absent and WebGL is ~10-40x too slow:
  #    draws<200, rAF~4fps, boot reveal 5-6s). So this job runs on a GPU-capable runner.
  #    Provision it (self-hosted GPU runner OR a GitHub GPU larger runner) and set the repo
  #    variable E2E_RUNNER_LABELS to its label(s) as a JSON array — full setup in
  #    docs/ci-gpu-runner.md. Default targets a self-hosted runner labelled `gpu`.
  #
  #    The Playwright webServer (playwright.config.ts) serves the real static `out/` export
  #    read-only (not `next start`), so there is no SSR gateway fetch to 127.0.0.1:8000 and
  #    no .next race; this prebuild step materialises that `out/` once.
  test:
    runs-on: ${{ fromJSON(vars.E2E_RUNNER_LABELS || '["self-hosted","gpu"]') }}
    timeout-minutes: 30
    env:
      CI: "true"
      # build:static (FIREBASE_STATIC_EXPORT=1 + production) hard-requires this key
      # (next.config.js fail-loud); the regular `next build` does not but mirrors
      # production with it. Restricted by HTTP referrer.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Materialise the production static export ONCE; the Playwright webServer serves it
      # read-only and globalSetup's ensureStaticBuild then finds it fresh and no-ops.
      - run: npm run build:static
      # Run under a virtual X display so headless Chromium can reach the runner's GPU via
      # the driver (hardware GL → backdrop-filter compositing + real WebGL frame rates).
      # xvfb-run is a no-op-safe wrapper if the runner already provides a display.
      - run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npx playwright test

  # ── Performance / quality budgets (TC-NFR-PERF): Lighthouse via lighthouserc.json.
  #    lighthouserc.json gates ONLY two things: performance (WARN, a cinematic WebGL
  #    site can't hit 0.9) and cumulative-layout-shift (hard ERROR, ≤0.1). a11y + SEO
  #    are gated by the separate `axe` job (validate:phase06), not by Lighthouse. ──
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lighthouse budgets (lighthouserc.json)
        run: |
          npx next start -p 3000 &
          SERVER_PID=$!
          for _ in $(seq 1 45); do curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1 && break; sleep 1; done
          npx --yes @lhci/cli@0.13.0 collect --config=lighthouserc.json
          npx --yes @lhci/cli@0.13.0 assert --config=lighthouserc.json
          STATUS=$?
          kill "$SERVER_PID" 2>/dev/null || true
          exit $STATUS

  # ── Accessibility (TC-NFR-A11Y): axe + SEO/schema ──
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: axe accessibility + SEO
        run: npm run validate:phase06

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, lint, test, lighthouse, axe]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:static
        env:
          # Inlined into the client bundle for the MiniVic Gemini brain.
          # Restrict this key by HTTP referrer in Google AI Studio (see SPEC §0.1 / QA-SEC-01).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: out
          retention-days: 7

  # ── Automated deploy to Firebase Hosting (live channel). Runs ONLY on push to
  #    main, after every gate is green. PRs get the full CI but never deploy. ──
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: static-site
          path: out
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: forgotten-mistory
          channelId: live
