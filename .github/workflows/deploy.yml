name: Deploy

# One pipeline, one job, one responsibility: put the latest of everything on
# production. It runs on every push to main and every ten minutes, consolidates
# every other branch into main first (so nothing a parallel agent committed is
# left behind), builds the static export, deploys it, and reads the deployed
# commit back from the live page.
#
# It gates on nothing and it escalates nothing. Tests, lint, audits and
# Lighthouse live in checks.yml and report; they never sit between a commit and
# production. A branch that merges cleanly is merged and deleted; a branch that
# conflicts is merged anyway with the branch's newer change winning each
# conflicting hunk (-X theirs), so parallel agents working on the same files
# never stall the line — a wrong resolution is fixed forward in the next
# ten-minute cycle, not by stopping. A build that cannot compile is the only
# thing that stops a deploy, because then there is nothing to ship.

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Runs queue behind each other and never cancel a deploy in flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  consolidate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Consolidate every branch into main
        id: consolidate
        run: |
          set -euo pipefail
          git config user.name "forgotten-mistory-deploy"
          git config user.email "deploy@forgotten-mistory.web.app"
          git fetch --prune origin
          merged=()
          forced=()
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/ | grep -vE '^origin(/(main|HEAD))?$'); do
            name="${ref#origin/}"
            if git merge --no-edit "$ref" -m "consolidate: merge $name into main"; then
              merged+=("$name")
            else
              # The branch carries the newer, intentional change: it wins every
              # conflicting hunk. Anything -X theirs cannot settle (add/add,
              # binary, delete/modify) is taken from the branch outright.
              git merge --abort
              if ! git merge --no-edit -X theirs "$ref" -m "consolidate: merge $name into main (branch wins conflicts)"; then
                git diff --name-only --diff-filter=U | while read -r f; do
                  if git cat-file -e "$ref:$f" 2>/dev/null; then git checkout --theirs -- "$f"; else git rm -q -- "$f"; fi
                done
                git add -A
                git -c core.editor=true commit --no-edit -m "consolidate: merge $name into main (branch wins conflicts)"
              fi
              forced+=("$name")
            fi
          done
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git push origin HEAD:main
          fi
          for name in "${merged[@]}" "${forced[@]}"; do
            if ! git push origin --delete "$name"; then
              echo "::warning::merged $name but could not delete it on the remote"
            fi
          done
          {
            echo "## Consolidation"
            echo ""
            echo "- deploying: \`$(git rev-parse --short=8 HEAD)\`"
            echo "- merged cleanly and deleted: ${merged[*]:-none}"
            echo "- merged with the branch winning conflicts, then deleted: ${forced[*]:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
          for name in "${forced[@]}"; do
            echo "::warning::branch $name conflicted with main; its hunks won — review the result in the next cycle"
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      # A branch merged above may have moved package.json ahead of the lockfile.
      # That must not stop the line: fall back to a plain install and say so.
      - name: Install dependencies
        run: |
          set -euo pipefail
          if ! npm ci; then
            echo "::warning::npm ci failed (lockfile drift from a merged branch?) — installing from package.json"
            npm install --no-audit --no-fund
          fi

      # firebase.json declares `predeploy: npm run build:static`, so the deploy
      # command builds the export from this exact checkout and ships it. The
      # build stamps the page with the commit it was built from.
      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: forgotten-mistory
          channelId: live

      - name: Verify the live page carries the deployed commit
        run: |
          set -euo pipefail
          expected="${{ steps.consolidate.outputs.sha }}"
          for _ in $(seq 1 12); do
            live="$(curl -fsS --max-time 20 https://forgotten-mistory.web.app/ | awk 'match($0, /name="build-commit" content="[0-9a-f]+"/) { s = substr($0, RSTART, RLENGTH); sub(/.*content="/, "", s); sub(/"$/, "", s); print s; exit }')"
            if [ -n "$live" ] && [[ "$expected" == "$live"* ]]; then
              echo "live page serves $live (HEAD $expected)"
              echo "- verified live: \`$live\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::live page serves '${live:-nothing}', expected ${expected:0:8}"
          exit 1
