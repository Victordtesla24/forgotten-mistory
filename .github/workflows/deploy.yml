name: Deploy

on:
  push:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  provider_keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run validate:provider-keys
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          DID_API_KEY: ${{ secrets.DID_API_KEY }}

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, provider_keys]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build -f Dockerfile.frontend -t ghcr.io/${{ github.repository_owner }}/forgotten-mistory-frontend:${{ github.sha }} .
      - run: docker build -f services/api-gateway/Dockerfile -t ghcr.io/${{ github.repository_owner }}/forgotten-mistory-api-gateway:${{ github.sha }} services/api-gateway
      - run: docker build -f services/llm-engine/Dockerfile -t ghcr.io/${{ github.repository_owner }}/forgotten-mistory-llm-engine:${{ github.sha }} services/llm-engine
      - run: docker build -f services/realtime-orchestrator/Dockerfile -t ghcr.io/${{ github.repository_owner }}/forgotten-mistory-realtime-orchestrator:${{ github.sha }} services/realtime-orchestrator
      - run: docker push ghcr.io/${{ github.repository_owner }}/forgotten-mistory-frontend:${{ github.sha }}
      - run: docker push ghcr.io/${{ github.repository_owner }}/forgotten-mistory-api-gateway:${{ github.sha }}
      - run: docker push ghcr.io/${{ github.repository_owner }}/forgotten-mistory-llm-engine:${{ github.sha }}
      - run: docker push ghcr.io/${{ github.repository_owner }}/forgotten-mistory-realtime-orchestrator:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/forgotten-mistory
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull
            ./scripts/deploy/blue_green_deploy.sh "${IMAGE_TAG}"
