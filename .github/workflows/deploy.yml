name: Deploy

# One pipeline, one job, one responsibility: put the latest of everything on
# production. It runs on every push to main and every ten minutes, consolidates
# every other branch into main first (so nothing a parallel agent committed is
# left behind), builds the static export, deploys it, and reads the deployed
# commit back from the live page.
#
# It gates on nothing. Tests, lint, audits and Lighthouse live in checks.yml and
# report; they never sit between a commit and production. A build that cannot
# compile is the only thing that stops a deploy, because there is nothing to
# ship. Branch policy at rest: main only — a branch that merges cleanly is
# merged and deleted here; a branch that conflicts is left alone and named in
# the run summary for a human or an agent to resolve.

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Runs queue behind each other and never cancel a deploy in flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  consolidate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Consolidate every branch into main
        id: consolidate
        run: |
          set -euo pipefail
          git config user.name "forgotten-mistory-deploy"
          git config user.email "deploy@forgotten-mistory.web.app"
          git fetch --prune origin
          merged=()
          skipped=()
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/ | grep -vE '^origin/(main|HEAD)$'); do
            name="${ref#origin/}"
            if git merge --no-edit "$ref" -m "consolidate: merge $name into main"; then
              merged+=("$name")
            else
              git merge --abort
              skipped+=("$name")
            fi
          done
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git push origin HEAD:main
          fi
          for name in "${merged[@]}"; do
            if ! git push origin --delete "$name"; then
              echo "::warning::merged $name but could not delete it on the remote"
            fi
          done
          {
            echo "## Consolidation"
            echo ""
            echo "- deploying: \`$(git rev-parse --short=8 HEAD)\`"
            echo "- merged and deleted: ${merged[*]:-none}"
            echo "- left in place (conflict, needs a human or an agent): ${skipped[*]:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
          for name in "${skipped[@]}"; do
            echo "::warning::branch $name conflicts with main and was not merged"
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # firebase.json declares `predeploy: npm run build:static`, so the deploy
      # command builds the export from this exact checkout and ships it. The
      # build stamps the page with the commit it was built from.
      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: forgotten-mistory
          channelId: live

      - name: Verify the live page carries the deployed commit
        run: |
          set -euo pipefail
          expected="${{ steps.consolidate.outputs.sha }}"
          for _ in $(seq 1 12); do
            live="$(curl -fsS --max-time 20 https://forgotten-mistory.web.app/ | grep -oE 'name="build-commit" content="[0-9a-f]+"' | grep -oE '[0-9a-f]{7,40}' || true)"
            if [ -n "$live" ] && [[ "$expected" == "$live"* ]]; then
              echo "live page serves $live (HEAD $expected)"
              echo "- verified live: \`$live\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::live page serves '${live:-nothing}', expected ${expected:0:8}"
          exit 1
